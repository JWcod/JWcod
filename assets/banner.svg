<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Jensen Wang. From silicon to agents.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b17"/><stop offset="1" stop-color="#0e1730"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5eead4"/><stop offset="0.55" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6b7fb0" stroke-opacity="0.12"/></pattern>
<radialGradient id="glow" cx="0.7" cy="0.5" r="0.55"><stop offset="0" stop-color="#4f7cff" stop-opacity="0.22"/><stop offset="1" stop-color="#4f7cff" stop-opacity="0"/></radialGradient>

<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.dot{animation:rise 3.6s linear infinite}
.flow{stroke-dasharray:5 7;animation:flow 1.8s linear infinite}
.cur{animation:blink 1.1s steps(1) infinite}
.plate{animation:float 6s ease-in-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-250px);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes blink{50%{opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
</style>
</defs>
<rect width="1200" height="400" rx="18" fill="url(#bg)"/>
<rect width="1200" height="400" rx="18" fill="url(#grid)"/>
<rect width="1200" height="400" rx="18" fill="url(#glow)"/>
<rect x="0.5" y="0.5" width="1199" height="399" rx="18" fill="none" stroke="#2a3a66"/>

<text x="64" y="78" class="mono" font-size="13" fill="#5eead4" letter-spacing="3">JENSEN WANG  /  王子宸</text>
<rect x="64" y="92" width="48" height="3" fill="url(#acc)"/>
<text x="64" y="188" class="sans" font-size="70" font-weight="800" fill="#f4f7fb" letter-spacing="-1.5">From silicon</text>
<text x="64" y="268" class="sans" font-size="70" font-weight="800" fill="url(#acc)" letter-spacing="-1.5">to agents.</text>
<text x="64" y="316" class="sans" font-size="20" fill="#b4c3e4">EE at Purdue. I build across the whole stack:</text>
<text x="64" y="344" class="sans" font-size="20" fill="#b4c3e4">FPGA and firmware up to AI agent workflows.</text>
<rect x="64" y="362" width="10" height="18" fill="#5eead4" class="cur"/>
<text x="84" y="377" class="mono" font-size="13" fill="#6f84b3">Purdue ECE  |  originally from Taiwan</text>

<line x1="780" y1="38" x2="780" y2="388" stroke="#5eead4" stroke-opacity="0.55" class="flow"/>
<g class="plate" style="animation-delay:2.0999999999999996s">
  <polygon points="662,336 780,376 780,388 662,348" fill="#6d28d9" fill-opacity="0.55"/>
  <polygon points="780,376 898,336 898,348 780,388" fill="#6d28d9" fill-opacity="0.85"/>
  <polygon points="780,296 898,336 780,376 662,336" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-width="1.6"/>
  <polygon points="780,306 878,336 780,366 682,336" fill="none" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 5"/>
</g><g class="plate" style="animation-delay:1.4s">
  <polygon points="662,250 780,290 780,302 662,262" fill="#1d4ed8" fill-opacity="0.55"/>
  <polygon points="780,290 898,250 898,262 780,302" fill="#1d4ed8" fill-opacity="0.85"/>
  <polygon points="780,210 898,250 780,290 662,250" fill="#60a5fa" fill-opacity="0.16" stroke="#60a5fa" stroke-width="1.6"/>
  <polygon points="780,220 878,250 780,280 682,250" fill="none" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 5"/>
</g><g class="plate" style="animation-delay:0.7s">
  <polygon points="662,164 780,204 780,216 662,176" fill="#0e7490" fill-opacity="0.55"/>
  <polygon points="780,204 898,164 898,176 780,216" fill="#0e7490" fill-opacity="0.85"/>
  <polygon points="780,124 898,164 780,204 662,164" fill="#67e8f9" fill-opacity="0.16" stroke="#67e8f9" stroke-width="1.6"/>
  <polygon points="780,134 878,164 780,194 682,164" fill="none" stroke="#67e8f9" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 5"/>
</g><g class="plate" style="animation-delay:0.0s">
  <polygon points="662,78 780,118 780,130 662,90" fill="#0f766e" fill-opacity="0.55"/>
  <polygon points="780,118 898,78 898,90 780,130" fill="#0f766e" fill-opacity="0.85"/>
  <polygon points="780,38 898,78 780,118 662,78" fill="#5eead4" fill-opacity="0.16" stroke="#5eead4" stroke-width="1.6"/>
  <polygon points="780,48 878,78 780,108 682,78" fill="none" stroke="#5eead4" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 5"/>
</g>
<circle class="dot" cx="780" cy="346" r="3" fill="#5eead4" style="animation-delay:0s"/><circle class="dot" cx="780" cy="346" r="3" fill="#5eead4" style="animation-delay:1.2s"/><circle class="dot" cx="780" cy="346" r="3" fill="#5eead4" style="animation-delay:2.4s"/>
<line x1="888" y1="82" x2="914" y2="82" stroke="#5eead4" stroke-opacity="0.5" stroke-dasharray="2 4"/>
<text x="920" y="78" class="mono" font-size="13" font-weight="700" fill="#5eead4" letter-spacing="2">AGENTS</text>
<text x="920" y="96" class="mono" font-size="11" fill="#8fa3cc">workflows that research, build, verify</text>
<line x1="888" y1="168" x2="914" y2="168" stroke="#67e8f9" stroke-opacity="0.5" stroke-dasharray="2 4"/>
<text x="920" y="164" class="mono" font-size="13" font-weight="700" fill="#67e8f9" letter-spacing="2">SOFTWARE</text>
<text x="920" y="182" class="mono" font-size="11" fill="#8fa3cc">Python, APIs, data products</text>
<line x1="888" y1="254" x2="914" y2="254" stroke="#60a5fa" stroke-opacity="0.5" stroke-dasharray="2 4"/>
<text x="920" y="250" class="mono" font-size="13" font-weight="700" fill="#60a5fa" letter-spacing="2">FIRMWARE</text>
<text x="920" y="268" class="mono" font-size="11" fill="#8fa3cc">bare-metal C, SPI / I2C / ADC / PWM</text>
<line x1="888" y1="340" x2="914" y2="340" stroke="#a78bfa" stroke-opacity="0.5" stroke-dasharray="2 4"/>
<text x="920" y="336" class="mono" font-size="13" font-weight="700" fill="#a78bfa" letter-spacing="2">SILICON</text>
<text x="920" y="354" class="mono" font-size="11" fill="#8fa3cc">RTL, FPGA, MRAM reliability</text>

</svg>

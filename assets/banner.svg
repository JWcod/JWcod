<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Jensen Wang. Building AI agents that ship.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5b6b95" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; }
      .flow { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
      @keyframes flow { to { stroke-dashoffset: -28 } }
      @keyframes blink { 50% { opacity: 0 } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="#2a3a66" stroke-opacity="0.8"/>

  <!-- left: text -->
  <text x="64" y="70" class="mono" font-size="15" fill="#5eead4" letter-spacing="2">~/jensen $ agent --run</text>
  <text x="64" y="150" class="sans" font-size="64" font-weight="700" fill="#f1f5f9">Jensen Wang</text>
  <text x="64" y="204" class="sans" font-size="30" font-weight="500" fill="url(#accent)">Building AI agents that ship.</text>
  <text x="64" y="252" class="mono" font-size="16" fill="#9fb0d6">EE @ Purdue  |  agents, data products, hardware</text>
  <rect x="64" y="268" width="10" height="20" fill="#5eead4" class="cursor"/>

  <!-- right: agent graph -->
  <g transform="translate(0,0)">
    <g stroke="url(#accent)" stroke-width="2" fill="none" class="flow" stroke-opacity="0.85">
      <path d="M860 160 L960 90"/>
      <path d="M860 160 L960 230"/>
      <path d="M960 90 L1070 130"/>
      <path d="M960 230 L1070 190"/>
      <path d="M1070 130 L1070 190"/>
    </g>
    <g fill="#0b1020" stroke="#5eead4" stroke-width="2">
      <circle cx="860" cy="160" r="26"/>
      <circle cx="960" cy="90" r="18" stroke="#60a5fa"/>
      <circle cx="960" cy="230" r="18" stroke="#60a5fa"/>
      <circle cx="1070" cy="130" r="14" stroke="#60a5fa"/>
      <circle cx="1070" cy="190" r="14" stroke="#60a5fa"/>
    </g>
    <circle cx="860" cy="160" r="9" fill="#5eead4" class="pulse"/>
    <circle cx="960" cy="90" r="5" fill="#60a5fa" class="pulse" style="animation-delay:.4s"/>
    <circle cx="960" cy="230" r="5" fill="#60a5fa" class="pulse" style="animation-delay:.8s"/>
    <circle cx="1070" cy="130" r="4" fill="#60a5fa" class="pulse" style="animation-delay:1.2s"/>
    <circle cx="1070" cy="190" r="4" fill="#60a5fa" class="pulse" style="animation-delay:1.6s"/>
    <text x="826" y="214" class="mono" font-size="12" fill="#9fb0d6">orchestrator</text>
    <text x="932" y="62" class="mono" font-size="12" fill="#9fb0d6">research</text>
    <text x="940" y="270" class="mono" font-size="12" fill="#9fb0d6">build</text>
  </g>
</svg>
